# Full demo stack [ENV-07]: gateway, Redis, Postgres, two simulated providers,
# Prometheus and Grafana with the shipped dashboards. Use deploy/demo/up.sh / down.sh.
name: llm-gateway-demo
services:
  sim:
    image: ${GATEWAY_IMAGE:-llm-gateway:dev}
    entrypoint: ["/usr/local/bin/simprovider", "-instance", "sima=:9001", "-instance", "simb=:9002"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/demo/up.sh}
      POSTGRES_DB: gateway
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gw", "-d", "gateway"]
      interval: 2s
      retries: 30
  gateway:
    image: ${GATEWAY_IMAGE:-llm-gateway:dev}
    command: ["-config", "/etc/gateway/conf"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      sim: {condition: service_started}
    environment:
      SIMA_URL: http://sim:9001/v1
      SIMB_URL: http://sim:9002/v1
      LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgres://gw:${POSTGRES_PASSWORD}@postgres:5432/gateway?sslmode=disable
      DEMO_KEY_A: ${DEMO_KEY_A:?run deploy/demo/up.sh}
      DEMO_KEY_B: ${DEMO_KEY_B:?run deploy/demo/up.sh}
      DEMO_ADMIN_KEY: ${DEMO_ADMIN_KEY:?run deploy/demo/up.sh}
      WAL_DIR: /tmp/gateway-wal
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["${DEMO_CONF_DIR:-./.run/conf}:/etc/gateway/conf:ro"]
    ports: ["${GATEWAY_PORT:-8080}:8080"]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?run deploy/demo/up.sh}
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]
volumes:
  pgdata: {}
